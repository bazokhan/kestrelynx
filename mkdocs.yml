site_name: KestreLynx
site_url: https://kestrelynx.dev/
site_description: >-
  Official documentation and technical articles for KestreLynx, open-source
  software providing scanning and notifications for running container images
  in Docker and Kubernetes, with remediation plans and pull requests
  (experimental) for Docker and Compose.
repo_name: kitsunetrail/kestrelynx
repo_url: https://github.com/kitsunetrail/kestrelynx
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Documentation:
      - Overview: documentation/index.md
      - Setup: documentation/getting-started.md
      - Configuration: documentation/configuration.md
      - Remediation plans and pull requests (experimental):
          - Overview: documentation/remediation.md
          - Enabling remediation: documentation/remediation-setup.md
          - When no candidate or pull request appears: documentation/remediation-troubleshooting.md
          - Reading the results: documentation/remediation-results.md
          - How candidates and pull requests are decided: documentation/remediation-logic.md
          - Supported inputs and reason codes: documentation/remediation-reference.md
      - Runtime usage (experimental): documentation/runtime-usage.md
      - How it works: documentation/how-it-works.md
  - Development:
      - Overview: development/index.md
      - Remediation plan and pull request development: development/remediation-pull-requests.md
      - Short-lived container scanning development: development/short-lived-containers.md
      - Kubernetes sensor feasibility: development/kubernetes-runtime-sensor.md
      - Runtime evidence prioritization development: development/runtime-prioritization-development.md
      - Runtime evidence observation environment validation: development/runtime-environment-validation.md
      - Runtime evidence coverage validation: development/runtime-coverage-validation.md
      - Runtime evidence observation with eBPF: development/runtime-event-evidence.md
      - Runtime evidence prioritization: development/runtime-prioritization.md
      - Kubernetes support: development/kubernetes-support.md
      - Kubernetes scanning landscape: development/kubernetes-scanning-landscape.md
      - Remediation relations model: development/remediation-relations-model.md
      - Environment and workload model: development/environment-workload-model.md
      - Image identity model: development/image-identity-model.md
  - Articles:
      - Overview: articles/index.md
      - CVE Basics and the Publication Process: articles/cve-basics-and-publication-flow.md
      - KEV Catalog Basics and Usage: articles/kev-known-exploited-vulnerabilities.md
      - EPSS Basics and How to Check Scores: articles/epss-exploit-prediction-scoring-system.md
      - CVSS Basics and the Scoring and Publication Process: articles/cvss-basics-scoring-and-publication.md
      - Trivy Basics and How to Read Scan Results: articles/trivy-basics-scan-results.md
      - How to Map Running Container Processes to OS Packages with procfs: articles/procfs-process-to-package-mapping.md
      - How to Check Runtime Usage of Packages Reported by Container Vulnerability Scans: articles/which-container-scan-findings-are-actually-running.md
      - Reading Process Information Without Root Using Linux Capabilities: articles/linux-capabilities-read-process-info.md
      - Understanding and Checking Trivy Status Values: articles/trivy-vulnerability-status.md
      - Observing Container Execution and File Opens with bpftrace: articles/bpftrace-container-exec-open-events.md
      - Mapping Language Packages Detected by Trivy to Runtime Files: articles/trivy-language-packages-runtime-mapping.md
      - Interactive Guide to the bpftrace Measurement Workflow: articles/bpftrace-event-observation-interactive.md
      - Interactive Guide to the procfs Package Mapping Workflow: articles/procfs-package-mapping-interactive.md

plugins:
  - search
  - social:
      cards_layout_dir: overrides/social
      cards_layout: kestrelynx
      cards_layout_options:
        font_family: Noto Sans JP
        # Add logo: path/to/logo.png here once the logo is ready.

watch:
  - overrides/social

hooks:
  # Generate per-page hreflang and language-selector links when building HTML.
  - scripts/docs_alternates.py

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  # Site roots and source directories; the hook resolves each translated page.
  alternate:
    - name: English
      link: https://kestrelynx.dev/
      lang: en
      docs_dir: docs
    - name: 日本語
      link: https://kestrelynx.dev/ja/
      lang: ja
      docs_dir: docs-ja
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kitsunetrail/kestrelynx
      name: KestreLynx on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/kitsunetraildev
      name: KitsuneTrail on X

copyright: Copyright &copy; 2026 Kitsune Trail
