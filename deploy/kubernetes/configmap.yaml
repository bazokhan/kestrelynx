# Example config.yml, based on config.example.yml with the kubernetes:
# adapter enabled. Fill in a notify target and copy/edit before applying —
# this is a starting point, not meant to be applied as-is.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kestrelynx-config
  namespace: kestrelynx
data:
  config.yml: |
    schedule:
      daily_at: "09:00"
      run_on_start: true

    scan:
      severity: [HIGH, CRITICAL]

    notify:
      slack_webhook_url: ""
      # Optional SMTP email (TLS required: starttls or tls):
      # email:
      #   host: smtp.example.com
      #   port: 587
      #   tls: starttls
      #   from: kestrelynx@example.com
      #   to: [ops@example.com]
      notify_on_clean: false
      mode: "diff"
      full_report_day: "monday"

    kubernetes:
      enabled: true
      # Leave api_server/token_file/ca_file empty in-cluster: they default to
      # this Pod's own ServiceAccount token and CA.
      namespaces: []

    environment:
      name: ""

    state:
      path: "/var/lib/kestrelynx/state.json"

    triage:
      enabled: true
      act_now_epss: 0.10
      watch_epss: 0.01
      discussion_links: true
