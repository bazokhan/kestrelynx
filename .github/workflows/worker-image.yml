name: Work image

# Builds the work image for both platforms without pushing, so a change to the
# image, the job runner or the job protocol is checked before it reaches main.
on:
  pull_request:
    paths:
      - Dockerfile.worker
      - cmd/kestrelynx-worker/**
      - internal/worker/**
      - .github/workflows/worker-image.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=worker
