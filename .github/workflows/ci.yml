name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      # Unit tests only: integration tests (real trivy + network) are gated
      # behind -short and excluded here to keep CI fast and hermetic.
      - run: go test ./... -short

  # The main image carries the program that runs in the update containers,
  # cross-compiled for both platforms inside its build. Building it without
  # pushing checks that a change to the image, the program or the job protocol
  # still builds before it reaches main.
  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
