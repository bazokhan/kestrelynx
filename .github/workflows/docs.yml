name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-ja/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "requirements-docs.txt"
      - "scripts/docs_alternates.py"
      - "scripts/check_doc_alternates.py"
      - "scripts/docs_indexnow.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-ja/**"
      - "overrides/**"
      - "mkdocs.yml"
      - "mkdocs.ja.yml"
      - "requirements-docs.txt"
      - "scripts/docs_alternates.py"
      - "scripts/check_doc_alternates.py"
      - "scripts/docs_indexnow.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
    inputs:
      indexnow_resend_all:
        description: "Submit every page to IndexNow instead of only the changed ones"
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2
          python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: |
          mkdocs build --strict
          mkdocs build --strict --config-file mkdocs.ja.yml
          python scripts/check_doc_alternates.py site
      - name: Compute IndexNow changes
        # Writes site/indexnow-manifest.json for the next build and lists the
        # URLs that changed since the manifest currently published. Without
        # --previous every page is listed, which recovers from a failed submission.
        env:
          RESEND_ALL: ${{ inputs.indexnow_resend_all == true }}
        run: |
          previous=(--previous https://kestrelynx.dev/indexnow-manifest.json)
          if [ "$RESEND_ALL" = "true" ]; then previous=(); fi
          python scripts/docs_indexnow.py diff site "${previous[@]}" \
            --output indexnow-changes.json
      - name: Upload IndexNow changes
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-changes
          path: indexnow-changes.json
          retention-days: 1
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/docs_indexnow.py
          sparse-checkout-cone-mode: false
      - name: Download IndexNow changes
        uses: actions/download-artifact@v8
        with:
          name: indexnow-changes
      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 scripts/docs_indexnow.py submit indexnow-changes.json \
            --host kestrelynx.dev --key c118876f78a02513746eb9fc5da2cf5c
