INHERIT: mkdocs.yml

site_name: KestreLynx ドキュメント
site_url: https://kestrelynx.dev/ja/
site_description: >-
  Docker・Kubernetesの稼働イメージのスキャン・通知と、
  Docker・Compose向けの修正計画と修正PR（実験的）を提供するOSS、
  KestreLynxの公式ドキュメントと技術記事。
docs_dir: docs-ja
site_dir: site/ja
edit_uri: edit/main/docs-ja/

theme:
  language: ja

copyright: Copyright &copy; 2026 Kitsune Trail

nav:
  - ホーム: index.md
  - ドキュメント:
      - 概要: documentation/index.md
      - セットアップ: documentation/getting-started.md
      - 設定: documentation/configuration.md
      - 仕組み:
          - 概要: documentation/how-it-works.md
          - スキャンと優先度の判定: documentation/scan-logic.md
          - 差分と履歴の判定: documentation/diff-logic.md
          - 通知の送信条件: documentation/notification-conditions.md
          - Slackの読み方: documentation/slack-display.md
          - Webhookのフィールド仕様: documentation/webhook-reference.md
          - Webhookの修正計画フィールド: documentation/webhook-remediation-reference.md
          - 外向きの通信: documentation/outbound-communication.md
      - 修正計画と修正PR（実験的）:
          - 概要: documentation/remediation.md
          - 有効化の手順: documentation/remediation-setup.md
          - 候補やPRが出ない場合: documentation/remediation-troubleshooting.md
          - 結果の読み方: documentation/remediation-results.md
          - 候補選定とPR処理の仕組み: documentation/remediation-logic.md
          - 対応形式と理由コード: documentation/remediation-reference.md
      - 稼働時の使用状況（実験的）: documentation/runtime-usage.md
  - 開発ログ:
      - 概要: development/index.md
      - 言語ランタイム本体の修正計画の開発: development/language-runtime-remediation.md
      - 言語ランタイム本体の脆弱性通知の開発: development/language-runtime-advisories.md
      - Kubernetes での修正 PR の開発: development/kubernetes-remediation.md
      - 依存元からの再解決の開発: development/dependent-reresolution.md
      - 修正計画と修正PRの開発: development/remediation-pull-requests.md
      - 短命なコンテナのスキャンの開発: development/short-lived-containers.md
      - KubernetesでのSensorの成立性の検証: development/kubernetes-runtime-sensor.md
      - 実行時証拠による優先順位付けの開発: development/runtime-prioritization-development.md
      - 実行時証拠の観測環境の検証: development/runtime-environment-validation.md
      - 実行時証拠の網羅性の検証: development/runtime-coverage-validation.md
      - eBPFによる実行時証拠の観測調査: development/runtime-event-evidence.md
      - 実行時証拠の優先順位付け調査: development/runtime-prioritization.md
      - Kubernetes対応の開発: development/kubernetes-support.md
      - Kubernetesスキャンツール調査: development/kubernetes-scanning-landscape.md
      - 修正関係モデル: development/remediation-relations-model.md
      - Environment / Workloadモデル: development/environment-workload-model.md
      - イメージ識別モデル: development/image-identity-model.md
  - 技術記事:
      - 概要: articles/index.md
      - CVEの基礎と公開の流れ: articles/cve-basics-and-publication-flow-ja.md
      - KEV Catalogの基礎と使い方: articles/kev-known-exploited-vulnerabilities-ja.md
      - EPSSの基礎とスコアの確認方法: articles/epss-exploit-prediction-scoring-system-ja.md
      - CVSSの基礎と評価・公開の流れ: articles/cvss-basics-scoring-and-publication-ja.md
      - Trivyの基礎とスキャン結果の読み方: articles/trivy-basics-scan-results-ja.md
      - procfsで稼働中コンテナのプロセスをOSパッケージに紐づける方法: articles/procfs-process-to-package-mapping-ja.md
      - コンテナの脆弱性スキャンで検出されたパッケージの実行時利用状況を確認する方法: articles/which-container-scan-findings-are-actually-running-ja.md
      - Linux capabilityでrootを使わずにプロセス情報を読む: articles/linux-capabilities-read-process-info-ja.md
      - TrivyのStatusの意味と確認方法: articles/trivy-vulnerability-status-ja.md
      - bpftraceでコンテナの実行とファイルオープンを観測する: articles/bpftrace-container-exec-open-events-ja.md
      - Trivyで検出した言語パッケージを実行時のファイル情報に紐づける: articles/trivy-language-packages-runtime-mapping-ja.md
      - bpftraceの計測プログラムの流れを追う動く図解: articles/bpftrace-event-observation-interactive-ja.md
      - procfsのパッケージ紐づけの流れを追う動く図解: articles/procfs-package-mapping-interactive-ja.md
