# KestreLynx configuration (single self-contained file). Copy to config.yml to use.
# Setting at least one notify target is enough to run; omit the rest to use defaults.

schedule:
  # Time of day to run once daily, in local time (HH:MM).
  # Leave empty to switch to interval mode ("every 24h since startup").
  daily_at: "09:00"
  # Run one scan immediately on startup.
  run_on_start: true

scan:
  # Severities to report on. Defaults to HIGH and CRITICAL only.
  severity: [HIGH, CRITICAL]

notify:
  # Slack Incoming Webhook (sends a preformatted message).
  slack_webhook_url: ""
  # Slack Web API delivery (alternative to the webhook — set one, not both):
  # a bot token with chat:write plus the destination channel ID. On top of the
  # same channel summary, this posts the full open-findings report into the
  # summary's thread (urgent/watch expanded, low as a count), and on quiet
  # days links back to the last full report instead.
  slack_bot_token: ""
  slack_channel: ""
  # Generic webhook (POSTs structured JSON). The receiver can process it freely.
  generic_webhook_url: ""
  # Whether to send a message even when nothing is wrong. Defaults to false (notify only on findings).
  notify_on_clean: false
  # diff (default): only notify what changed since the last scan, plus a one-line
  # "open now" summary with the age of the oldest unresolved finding. Days with
  # open findings but no changes get a short heartbeat instead of a repeat.
  # full: resend the complete report every scan (the pre-diff behavior).
  mode: "diff"
  # In diff mode, the weekday to send the complete report as a weekly digest,
  # so details are never more than a week away. Set to "never" to disable.
  full_report_day: "monday"
  # Wording language for Slack messages, thread reports, fix plans and PR
  # bodies: "en" (default) or "ja". The generic webhook stays in English.
  language: "en"

docker:
  # Path to docker.sock for container/image reads and, with remediation pull
  # requests enabled, management of language-update work containers.
  socket: "/var/run/docker.sock"

# Kubernetes adapter (alternative to docker: above, not both). See
# deploy/kubernetes/ for the manifests this is meant to run under.
# kubernetes:
#   # Set true to scan a Kubernetes cluster instead of a single Docker host.
#   # Mutually exclusive with docker.socket (leave that section out entirely).
#   enabled: false
#   # kube-apiserver base URL, e.g. "https://10.0.0.1:443". Leave empty inside
#   # a cluster: it's built from the KUBERNETES_SERVICE_HOST/PORT environment
#   # variables Kubernetes injects into every Pod.
#   api_server: ""
#   # ServiceAccount token path. Leave empty to use the projected token every
#   # Pod gets by default.
#   token_file: ""
#   # Cluster CA bundle path. Leave empty to use the default projected CA.
#   ca_file: ""
#   # Overrides the TLS server name used to validate the apiserver's
#   # certificate. Leave empty unless api_server names an address the
#   # certificate doesn't carry as a SAN.
#   tls_server_name: ""
#   # Restrict scanning to these namespaces. Empty (or omitted) scans every
#   # namespace. Each entry must be a valid namespace name (lowercase
#   # alphanumerics and hyphens, 1-63 bytes, alphanumeric ends).
#   namespaces: []

environment:
  # Optional name for this instance's scan history (e.g. "prod-vps"). This
  # names the history, not the machine: it is not derived from hostname/IP
  # and does not identify the host. Keep it unchanged across host rebuilds
  # and migrations and the history continues as the same environment. When
  # set, it is shown in the Slack header and in the generic webhook payload
  # so reports from multiple KestreLynx instances can be told apart.
  # Lowercase alphanumerics and hyphens only, 1-63 bytes, must start and
  # end with an alphanumeric. Leave empty for the unnamed default
  # environment (current single-host behavior, unchanged).
  name: ""

state:
  # Where diff mode remembers previous scans (JSON, one small file). Mount a
  # volume here so first-seen dates survive container recreation.
  path: "/var/lib/kestrelynx/state.json"

triage:
  # Rank findings by real-world exploitation signals instead of severity alone:
  # CISA KEV (confirmed exploitation) and EPSS (predicted probability) are
  # downloaded in bulk once a day and joined locally by CVE id without sending
  # your CVE list. Separately, discussion_links sends CVE IDs (see below).
  # Notifications become three buckets: act now / watch / low.
  # Adds outbound HTTPS to www.cisa.gov and epss.empiricalsecurity.com;
  # set enabled: false to opt out (severity-only notifications, no extra egress).
  enabled: true
  # EPSS probability at or above which a CVE is "act now". 0.10 = 10%.
  act_now_epss: 0.10
  # EPSS probability at or above which a CVE is at least "watch". 0.01 = 1%.
  watch_epss: 0.01
  # Mirror URLs for air-gapped environments. Empty = the official feeds.
  kev_url: ""
  epss_url: ""
  # Attach the Hacker News discussion link to "act now" findings. Unlike the
  # bulk feeds above, this sends those CVE IDs (only — a handful of well-known,
  # actively exploited CVEs) as search queries to hn.algolia.com. Set to false
  # to stop these searches. Notification delivery is unaffected; advisory links
  # from the KEV notes still work (they come from the bulk feed).
  discussion_links: true

runtime:
  # Show which packages an optional, experimental, separately-privileged Sensor companion
  # process (`kestrelynx sensor`, deploy/docker/docker-compose.sensor.yml)
  # actually observed running, alongside the ordinary vulnerability
  # findings. Requires deploying the Sensor and sharing its evidence volume
  # with this container (read-only) — see the Sensor compose file's own
  # comments for both steps. With no Sensor deployed, leave this false: the
  # main body never opens evidence_dir and every notification is unaffected.
  enabled: false
  # Where the Sensor's evidence volume is mounted into this container. Must
  # match the Sensor's own --evidence-dir (same default on both sides).
  evidence_dir: "/var/lib/kestrelynx-runtime"
  # Once runtime evidence is available, additionally hide from Slack (rows
  # only — the generic webhook always keeps every finding, with an added
  # muted/muted_reason marker) a package finding with no fix coming
  # (affected or will_not_fix; never fixed, and never end-of-life, which is
  # always shown) that nothing has used for at least 7 days of observation
  # and that isn't act now. Hidden findings are replaced by a single
  # "🔇 Muted" count; one that becomes used, gets a fix, or turns act now
  # reappears immediately as an ordinary change. Has no effect unless
  # enabled above is also true.
  mute_unfixable_not_in_use: false

# Fix plan (experimental). Available in Docker and Kubernetes modes.
# Kubernetes plans show published-image and Dockerfile base updates, floating-tag re-pull guidance,
# and language-package candidates.
#
# Both plans and pull requests are disabled by default. Plans select candidates
# for published images, Dockerfile base images and npm/pnpm/pip/uv packages.
#
# Image scans are compared under the same databases and settings; results
# appear in a separate Slack message and the generic webhook's remediation object.
#
# Slack fix plans are sent when their displayed content changes, and on the
# weekly report day in diff mode when there is something to show.
#
# Planning does not write to GitHub or use work containers; it saves local
# records and scan caches.
#
# Pull requests additionally allow GitHub writes and Docker work containers or configured Kubernetes work Pods
# for language-package updates.
#
# A candidate or PR does not mean a running image is fixed, and KestreLynx
# does not merge or deploy it.
#
# KestreLynx uses HTTPS to public or configured private image registries and
# GitHub for mapped sources; Trivy downloads databases and comparison images.
#
# Language updates use public npm and PyPI; Docker or Kubernetes nodes fetch official Node.js
# and Python images from Docker Hub or the configured mirror.
#
# With remediation disabled, scans and notifications are unchanged.
#
# remediation:
#   enabled: true
#   # Create PRs for checked changes: Compose or plain Kubernetes manifest image tags,
#   # Kustomize images[].newTag, Helm values image tags,
#   # Dockerfile FROM tags, or language dependency files. Image tag updates
#   # stay in the same major/minor series; language updates can cross major
#   # versions. Requires remediation.enabled, source mappings and
#   # github.token. No automatic merge or deployment; existing branches are
#   # not rewritten. PR creation can start the repository's pull_request CI.
#   # Language updates run in disposable Docker containers or configured Kubernetes Pods, with their
#   # output and before/after dependency-file scans checked by KestreLynx.
#   # Neither application tests nor image rebuilds are run. Off by default.
#   pull_requests:
#     enabled: false
#   # Token for GitHub. Empty reads public repositories anonymously, which is
#   # enough without pull requests. With pull_requests enabled it is required
#   # and needs the permissions Contents: Read and write and Pull requests:
#   # Read and write on the configured repositories only (a fine-grained
#   # personal access token limited to them). Keep the file readable by its
#   # owner only.
#   github:
#     token: ""
#   # Logins for private image registries, used to look for newer images and
#   # to scan candidates. A host without an entry is reached anonymously.
#   # host is the registry host as written in image references, with the port
#   # if there is one, and without scheme or path. The password is a secret;
#   # keep the file readable by its owner only. A login is sent to its own
#   # host over HTTPS, and to the registry's token service only when that
#   # service is on the same host or listed in token_hosts. KestreLynx's own
#   # requests do not pass it on at any redirect. Trivy, which scans the
#   # candidate images, attaches its token again when the registry redirects
#   # to another path of the same host, and does not when the redirect leads
#   # to another host.
#   # GitHub Container Registry (ghcr.io) does not accept fine-grained
#   # personal access tokens: use a personal access token (classic) with the
#   # read:packages scope, and the GitHub user name it belongs to as username.
#   # Docker Hub: host docker.io, an access token as password, and
#   # token_hosts: [auth.docker.io].
#   # registries:
#   #   - host: ghcr.io
#   #     username: example-user
#   #     password: example-token-from-github
#   #   - host: registry.example.com:5000
#   #     username: example-puller
#   #     password: example-password
#   #     token_hosts: []
#   # Absolute directory for plans, delivery and PR records; persist it across
#   # container recreation. It is independent of state.path and defaults to a
#   # directory inside the supplied state volume.
#   storage_dir: /var/lib/kestrelynx/remediation
#   # Where each running workload's source lives. Read and validated at
#   # startup. Each entry sets exactly one of compose (the Compose file and
#   # service that deploy it), dependencies (the directory holding its lockfiles),
#   # dockerfile (the Dockerfile that builds its image), or manifest (the Kubernetes
#   # manifest file), kustomize (an images entry in a kustomization file), or
#   # helm_values (an image key in a Helm values file). Paths are
#   # repository-relative and normalized; "." is the repository root. Example
#   # names only.
#   #
#   # Docker workload keys use compose/<project>/<service>. Kubernetes keys use
#   # <kind>/<namespace>/<name>/<container>, where kind is deployment,
#   # statefulset, daemonset, job, cronjob or pod.
#   # Kubernetes accepts manifest, kustomize, helm_values, dockerfile and dependencies mappings; compose
#   # mappings are configuration errors. With planning enabled, mappings outside
#   # kubernetes.namespaces produce a startup warning and have no effect.
#   # manifest mappings require Kubernetes mode. manifest.path is required;
#   # object.kind and object.name are optional and default to the workload's.
#   # An explicit object.kind must match the workload kind, for example Deployment.
#   # One container in a manifest object can be mapped to only one workload.
#   #
#   # Kubernetes example entries, used instead of the Compose entries below:
#   # - workload: deployment/example/web/app
#   #   repository: example/deployment
#   #   base_branch: main
#   #   manifest:
#   #     path: apps/web.yaml
#   #     object:
#   #       kind: Deployment
#   #       name: web
#   # - workload: deployment/example/api/app
#   #   repository: example/application
#   #   base_branch: main
#   #   dockerfile:
#   #     path: docker/Dockerfile
#   #     target: runtime
#   #
#   # Kustomize example: apps/kustomization.yaml contains:
#   #   images:
#   #     - name: nginx
#   #       newTag: "1.27.2" # Tag to use
#   #
#   # If this entry affects web/app, worker/app and the ordinary init container
#   # web/prepare, use this mapping instead of the manifest mapping for web/app:
#   # - workload: deployment/example/web/app
#   #   repository: example/deployment
#   #   base_branch: main
#   #   kustomize:
#   #     path: apps/kustomization.yaml
#   #     image: nginx
#   #     affects:
#   #       - deployment/example/worker/app
#   #       - deployment/example/web/prepare
#   #
#   # kustomize requires Kubernetes mode. path and image are required.
#   # The filename must be kustomization.yaml, kustomization.yml or Kustomization.
#   # image is images[].name without a tag or digest.
#   # affects lists every other affected workload key, including ordinary init
#   # containers; do not repeat keys or include the mapped workload itself.
#   # KestreLynx does not render Kustomize. Omitting affects means the user has
#   # confirmed that this entry affects only the mapped container.
#   # Every mapping to one entry must declare the same workload-plus-affects set.
#   # Each container can belong to only one tag edit location, including manifest
#   # locations. A workload can have only one of manifest, kustomize and helm_values mappings.
#   # Every mapping to the same file in the same repository needs one base_branch.
#   #
#   # All listed containers must agree on the declared/running reference and adopt
#   # the same candidate tag and digest. An ordinary init container is verified
#   # only through a scanned running member of the set in the same Pod, using the
#   # same image content under the same reference.
#   # An unlisted container declaring the same reference stops the update if it
#   # shares a namespace, Helm release or Flux Kustomization with the listed set,
#   # or appears in a listed workload's Pod spec.
#   # Only an existing string newTag in one YAML document is edited; quotes,
#   # comments and line endings are preserved. Existing newName values stay unchanged.
#   # See docs/documentation/remediation-reference.md#kustomize-formats for
#   # unsupported inputs and docs/documentation/remediation-logic.md#kustomize-prs
#   # for the full creation requirements.
#   #
#   # Helm example: apps/values.yaml contains:
#   #   image:
#   #     registry: docker.io
#   #     repository: library/nginx
#   #     tag: "1.27.2" # Tag to use
#   #
#   # If this key affects web/app, worker/app and the ordinary init container
#   # web/prepare, use this mapping instead of the manifest or kustomize mapping
#   # for web/app:
#   # - workload: deployment/example/web/app
#   #   repository: example/deployment
#   #   base_branch: main
#   #   helm_values:
#   #     path: apps/values.yaml
#   #     key: image
#   #     affects:
#   #       - deployment/example/worker/app
#   #       - deployment/example/web/prepare
#   #
#   # helm_values requires Kubernetes mode. path and key are required.
#   # path must name a .yaml or .yml values file. key is at most 255 bytes,
#   # with nonempty [A-Za-z0-9_-] segments separated by dots; keys containing
#   # literal dots are unsupported. Select the image mapping, not its tag field.
#   # The key can also hold a string such as image: "nginx:1.27.2".
#   # registry is optional in the mapping form.
#   # affects, matching workload-plus-affects sets, one tag edit location per
#   # container, one base_branch per file, checks across the whole set, and
#   # ordinary init container verification follow the Kustomize rules above.
#   # Omitting affects means the user has confirmed that only the mapped
#   # container is affected.
#   #
#   # Confirm that the key holds the final image value and is not overridden by
#   # Flux HelmRelease spec.values, Argo CD parameters/valuesObject/valuesFrom,
#   # CI --set, or another values file. KestreLynx does not render Helm.
#   # The PR body states these assumptions and the checks not performed.
#   # The repository, including registry, and tag must match both the declared
#   # and running image. Only the tag is edited, preserving quotes and comments.
#   # If an unquoted tag's replacement would not remain a string in Helm,
#   # it is written in double quotes and the PR body explains the change.
#   # See docs/documentation/remediation-reference.md#helm-values-formats for
#   # unsupported inputs and docs/documentation/remediation-logic.md#helm-values-prs
#   # for the full creation requirements.
#   #
#   # Kubernetes manifest, Kustomize, Helm values and Dockerfile PRs use the read-only scan RBAC.
#   # Language-package PRs additionally need the user-applied work namespace
#   # and permissions in deploy/kubernetes/work/. Merging may trigger
#   # deployment through external automatic synchronization or CI.
#   #
#   # For an image you build yourself, the findings in the layers of its base
#   # image are not fixed by a package update; a newer base image is. A
#   # dockerfile mapping names the Dockerfile and, optionally, the build stage
#   # (target) the running image comes from; without a target the last stage is
#   # used. KestreLynx follows the stage's FROM, through earlier stages that
#   # build on one another, to the base image, checks that the running image's
#   # layers start with the base's layers, and compares the current base with
#   # the newest patch of the same series, with a pull request that changes the
#   # tag in that FROM when pull_requests is enabled. The image rebuilt from the
#   # new Dockerfile is not built or scanned. For a service of a compose mapping
#   # whose build: is static (a context path, an optional dockerfile and target,
#   # no variables, no remote context, no dockerfile_inline), the Dockerfile is
#   # read from the build section and no dockerfile mapping is needed; a
#   # dockerfile mapping for the same workload must then agree with it. A base
#   # with a floating tag (for example python:3.12) gets no pull request; the
#   # plan says whether the tag still points at the base the image was built from
#   # and suggests rebuilding with `docker compose build --pull` if it does not.
#   #
#   # A dependencies mapping selects npm, pnpm, pip or uv files in one source
#   # directory.
#   #
#   # 1. Select findings with scan status fixed and reported fixed versions
#   # 2. For each finding, take the lowest reported fix newer than the installed version
#   # 3. Use the highest of those versions as the package's update lower bound
#   #
#   # Selection alone does not verify resolution; with PRs enabled, updated
#   # dependency files are checked separately, including before/after scans.
#   #
#   # npm and pnpm remove the targeted lockfile entries and regenerate the
#   # lockfile with install --package-lock-only or install --lockfile-only.
#   #
#   # uv uses lock --upgrade-package name==version; pip validates the original
#   # and updated requirements.txt in separate containers.
#   #
#   # npm, pnpm and uv may leave packages out and create a partial PR with
#   # verified updates; the omitted packages still need manual action.
#   #
#   # pip does not create partial updates. Updates may cross a major version;
#   # PR bodies and notifications call out major changes.
#   #
#   # If a direct dependency's range excludes a fix, supported specifiers are
#   # X.Y.Z, =X.Y.Z, ^X.Y.Z or ~X.Y.Z for npm/pnpm, and == or ~= for uv.
#   #
#   # Only the version part is edited; transitive updates must stay within
#   # existing dependency constraints.
#   #
#   # - Workspaces, Git/URL/local dependencies and source builds need manual handling
#   # - npm packages with bundled dependencies or shrinkwrap and their nested packages are restricted
#   # - pnpm 12 releases before 12.10.0 need manual handling
#   #
#   # A pnpm-workspace.yaml with only allowBuilds, onlyBuiltDependencies,
#   # ignoredBuiltDependencies, neverBuiltDependencies or supportedArchitectures is supported.
#   #
#   # A packages key, unsupported keys or an ancestor pnpm-workspace.yaml
#   # require manual handling.
#   #
#   # Node.js is selected using the project's version files, runtime declarations
#   # and package manager requirements.
#   #
#   # uv requires revision 5 of uv.lock. Python is selected from the supported
#   # table using .python-version and requires-python.
#   #
#   # pip runs in the default Python image but resolves for the running
#   # image's environment; an end-of-life target requires manual handling.
#   #
#   # Work containers receive no GitHub token, registry credentials, KestreLynx
#   # configuration or Docker socket.
#   #
#   # They run as non-root with all capabilities dropped, no-new-privileges
#   # and resource/time limits; writable areas use size-capped tmpfs.
#   #
#   # KestreLynx supplies the work program and checked tools to the official
#   # images and checks the container environment before running updates.
#   #
#   # In Docker mode, KestreLynx creates, starts and removes work containers through Docker API.
#   # A :ro socket mount does not restrict these API operations.
#   mappings:
#     - workload: compose/example/web
#       repository: example/deployment
#       base_branch: main
#       compose:
#         path: compose.yml
#         service: web
#     - workload: compose/example/api
#       repository: example/application
#       base_branch: main
#       dependencies:
#         directory: .
#     - workload: compose/example/app
#       repository: example/application
#       base_branch: main
#       dockerfile:
#         path: docker/Dockerfile
#         target: runtime
#   # Processing limits. Every value must be positive; work beyond a limit is
#   # deferred, not counted as having no candidate. Candidate scans and
#   # baseline rescans have separate per-cycle budgets. Registry requests
#   # include token exchanges; tag_pages_per_repository is per repository and
#   # counts tag listing requests (a pinned tag's series is read with a
#   # request for each step through the tag list, not page by page).
#   # cycle_timeout covers planning, dependency updates and PR processing,
#   # not the ordinary scans of running images.
#   # new_prs_per_cycle caps new PRs per cycle; open_prs caps open KestreLynx
#   # PRs across configured repositories (none is closed just to make room).
#   limits:
#     candidate_scans_per_cycle: 10
#     baseline_rescans_per_cycle: 10
#     registry_requests_per_cycle: 200
#     tag_pages_per_repository: 20
#     cycle_timeout: 30m
#     new_prs_per_cycle: 3
#     open_prs: 10
#     # With PRs enabled, dependency_jobs_per_cycle caps dependency update
#     # units attempted per cycle, not packages or containers; one unit can
#     # use multiple containers, as with pip or manifest edits.
#     # Units beyond this limit are deferred.
#     # job_timeout bounds each container's creation, execution and result
#     # collection, not the whole unit; cleanup has a separate 30s deadline.
#     # The accepted range is 1m to 60m30s, with 30s reserved from the internal
#     # job's deadline for startup and reporting (internal maximum: 60m).
#     dependency_jobs_per_cycle: 3
#     job_timeout: 6m
#   # Language updates use official Docker Hub Node.js and Python images,
#   # pinned by digest in a table bundled with KestreLynx.
#   #
#   # Supported series in that table are Node.js 22, 24 and 26 and Python
#   # 3.11 through 3.15; end-of-life series require manual handling.
#   #
#   # KestreLynx fetches npm, pnpm and uv from public registries, checks them
#   # and caches them under storage_dir; pip comes with the Python image.
#   #
#   # Cached tools are checked again before reuse and passed to work
#   # containers; Docker or Kubernetes nodes pull the images when first needed.
#   #
#   # An unavailable image or tool defers language updates; package managers
#   # are never run in the KestreLynx container instead.
#   #
#   # These settings are validated at startup even when remediation is disabled.
#   # worker:
#   #   # Kubernetes language-package updates, including supported re-resolution
#   #   # through dependent packages. Requires kubernetes.enabled: true,
#   #   # Kubernetes 1.30+, and user-applied deploy/kubernetes/work/ manifests.
#   #   # See docs/documentation/remediation-setup.md#kubernetes-language-updates.
#   #   # Nodes need containerLogMaxSize >= 144Mi and Pod PID limits;
#   #   # the example NetworkPolicy requires a CNI that enforces it.
#   #   # Omit this entire subsection to leave Kubernetes language updates manual.
#   #   kubernetes:
#   #     # No default namespace; setting it enables work Pods for PR processing.
#   #     namespace: kestrelynx-work
#   #     # Work Pod account without permissions or a token; default shown.
#   #     service_account: kestrelynx-work
#   #     # Must exist with preemptionPolicy: Never; default shown.
#   #     priority_class: kestrelynx-work
#   #     # KestreLynx repository@sha256:... for the receiving container.
#   #     # Empty reads the digest-pinned image from KestreLynx's own Pod status.
#   #     receiver_image: ""
#   #     # Maximum Pods held by this instance, including undeleted finished Pods.
#   #     # Default 1; accepted range 1..16; namespace quotas also apply.
#   #     max_concurrent_pods: 1
#   #     # Unsupported: a non-empty value makes language updates manual.
#   #     runtime_class: ""
#   #   # Keep these names and image repositories consistent with the work
#   #   # manifests and 52-policy-params.yaml, including any registry mirror.
#   #   # Optional Docker Hub mirror: lowercase host[:port][/path], with no
#   #   # scheme, tag or digest; empty uses Docker Hub.
#   #   registry: registry.example.com:5000/dockerhub
#   #   # The mirror serves library/node and library/python under this path,
#   #   # with the same digests; a mirror that changes an image is refused.
#   #   tool_versions:
#   #     # Positive duration since publication before npm, pnpm or uv is
#   #     # used; defaults to 72h, and zero or negative values are invalid.
#   #     min_release_age: 72h
#   #     # Integer bytes or an integer with B, KiB, MiB or GiB; defaults to
#   #     # 1GiB, with a minimum of 128MiB.
#   #     cache_max_size: 1GiB
#   #   # Development only: absolute directory of work programs; normally unset.
#   #   program_dir: ""
#   #   # When set, each program is checked against the hash recorded at
#   #   # startup whenever it is passed to a container.
