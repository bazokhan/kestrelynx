# KestreLynx configuration (single self-contained file). Copy to config.yml to use.
# Setting at least one notify target is enough to run; omit the rest to use defaults.

schedule:
  # Time of day to run once daily, in local time (HH:MM).
  # Leave empty to switch to interval mode ("every 24h since startup").
  daily_at: "09:00"
  # Run one scan immediately on startup.
  run_on_start: true

scan:
  # Severities to report on. Defaults to HIGH and CRITICAL only.
  severity: [HIGH, CRITICAL]

notify:
  # Slack Incoming Webhook (sends a preformatted message).
  slack_webhook_url: ""
  # Slack Web API delivery (alternative to the webhook — set one, not both):
  # a bot token with chat:write plus the destination channel ID. On top of the
  # same channel summary, this posts the full open-findings report into the
  # summary's thread (urgent/watch expanded, low as a count), and on quiet
  # days links back to the last full report instead.
  slack_bot_token: ""
  slack_channel: ""
  # Generic webhook (POSTs structured JSON). The receiver can process it freely.
  generic_webhook_url: ""
  # Whether to send a message even when nothing is wrong. Defaults to false (notify only on findings).
  notify_on_clean: false
  # diff (default): only notify what changed since the last scan, plus a one-line
  # "open now" summary with the age of the oldest unresolved finding. Days with
  # open findings but no changes get a short heartbeat instead of a repeat.
  # full: resend the complete report every scan (the pre-diff behavior).
  mode: "diff"
  # In diff mode, the weekday to send the complete report as a weekly digest,
  # so details are never more than a week away. Set to "never" to disable.
  full_report_day: "monday"
  # Wording language for the Slack channel message and thread report. "en"
  # (default) or "ja". The generic webhook payload is always English (it's
  # consumed programmatically, not read in Slack) and is never affected by
  # this setting.
  language: "en"

docker:
  # Path to docker.sock for container/image reads and, with remediation pull
  # requests enabled, management of language-update work containers.
  socket: "/var/run/docker.sock"

# Kubernetes adapter (alternative to docker: above, not both). See
# deploy/kubernetes/ for the manifests this is meant to run under.
# kubernetes:
#   # Set true to scan a Kubernetes cluster instead of a single Docker host.
#   # Mutually exclusive with docker.socket (leave that section out entirely).
#   enabled: false
#   # kube-apiserver base URL, e.g. "https://10.0.0.1:443". Leave empty inside
#   # a cluster: it's built from the KUBERNETES_SERVICE_HOST/PORT environment
#   # variables Kubernetes injects into every Pod.
#   api_server: ""
#   # ServiceAccount token path. Leave empty to use the projected token every
#   # Pod gets by default.
#   token_file: ""
#   # Cluster CA bundle path. Leave empty to use the default projected CA.
#   ca_file: ""
#   # Overrides the TLS server name used to validate the apiserver's
#   # certificate. Leave empty unless api_server names an address the
#   # certificate doesn't carry as a SAN.
#   tls_server_name: ""
#   # Restrict scanning to these namespaces. Empty (or omitted) scans every
#   # namespace. Each entry must be a valid namespace name (lowercase
#   # alphanumerics and hyphens, 1-63 bytes, alphanumeric ends).
#   namespaces: []

environment:
  # Optional name for this instance's scan history (e.g. "prod-vps"). This
  # names the history, not the machine: it is not derived from hostname/IP
  # and does not identify the host. Keep it unchanged across host rebuilds
  # and migrations and the history continues as the same environment. When
  # set, it is shown in the Slack header and in the generic webhook payload
  # so reports from multiple KestreLynx instances can be told apart.
  # Lowercase alphanumerics and hyphens only, 1-63 bytes, must start and
  # end with an alphanumeric. Leave empty for the unnamed default
  # environment (current single-host behavior, unchanged).
  name: ""

state:
  # Where diff mode remembers previous scans (JSON, one small file). Mount a
  # volume here so first-seen dates survive container recreation.
  path: "/var/lib/kestrelynx/state.json"

triage:
  # Rank findings by real-world exploitation signals instead of severity alone:
  # CISA KEV (confirmed exploitation) and EPSS (predicted probability) are
  # downloaded in bulk once a day and joined locally by CVE id — your CVE list
  # never leaves the host. Notifications become three buckets: act now / watch /
  # low. Adds outbound HTTPS to www.cisa.gov and epss.empiricalsecurity.com;
  # set enabled: false to opt out (severity-only notifications, no extra egress).
  enabled: true
  # EPSS probability at or above which a CVE is "act now". 0.10 = 10%.
  act_now_epss: 0.10
  # EPSS probability at or above which a CVE is at least "watch". 0.01 = 1%.
  watch_epss: 0.01
  # Mirror URLs for air-gapped environments. Empty = the official feeds.
  kev_url: ""
  epss_url: ""
  # Attach the Hacker News discussion link to "act now" findings. Unlike the
  # bulk feeds above, this sends those CVE IDs (only — a handful of well-known,
  # actively exploited CVEs) as search queries to hn.algolia.com. Set to false
  # for zero CVE egress; advisory links from the KEV notes still work (they
  # come from the bulk feed).
  discussion_links: true

runtime:
  # Show which packages an optional, experimental, separately-privileged Sensor companion
  # process (`kestrelynx sensor`, deploy/docker/docker-compose.sensor.yml)
  # actually observed running, alongside the ordinary vulnerability
  # findings. Requires deploying the Sensor and sharing its evidence volume
  # with this container (read-only) — see the Sensor compose file's own
  # comments for both steps. With no Sensor deployed, leave this false: the
  # main body never opens evidence_dir and every notification is unaffected.
  enabled: false
  # Where the Sensor's evidence volume is mounted into this container. Must
  # match the Sensor's own --evidence-dir (same default on both sides).
  evidence_dir: "/var/lib/kestrelynx-runtime"
  # Once runtime evidence is available, additionally hide from Slack (rows
  # only — the generic webhook always keeps every finding, with an added
  # muted/muted_reason marker) a package finding with no fix coming
  # (affected or will_not_fix; never fixed, and never end-of-life, which is
  # always shown) that nothing has used for at least 7 days of observation
  # and that isn't act now. Hidden findings are replaced by a single
  # "🔇 Muted" count; one that becomes used, gets a fix, or turns act now
  # reappears immediately as an ordinary change. Has no effect unless
  # enabled above is also true.
  mute_unfixable_not_in_use: false

# Fix plan (experimental). Docker only (including Compose source mappings);
# enabling it with kubernetes.enabled is a configuration error. Both plans
# and pull requests are disabled by default. Plans select update candidates
# for published images, Dockerfile base images and npm/pnpm/pip/uv packages,
# compare image scans under the same databases and settings, and report in
# Slack and the generic webhook's remediation object. Planning does not write
# to GitHub or use work containers; it does save local records and scan caches.
# Pull requests additionally allow GitHub writes and Docker work containers
# for language-package updates. A candidate or PR does not mean a running
# image is fixed, and KestreLynx does not merge or deploy it.
# Planning needs outbound HTTPS to public image registries, GitHub for mapped
# sources, and Trivy database downloads; language updates also use public npm
# and PyPI and require the Docker daemon to fetch the work image.
# With remediation disabled, scans and notifications are unchanged.
#
# remediation:
#   enabled: true
#   # Create PRs for checked changes: Compose services.<service>.image tags,
#   # Dockerfile FROM tags, or language dependency files. Image tag updates
#   # stay in the same major/minor series; language updates can cross major
#   # versions. Requires remediation.enabled, Docker mode, source mappings and
#   # github.token. No automatic merge or deployment; existing branches are
#   # not rewritten. PR creation can start the repository's pull_request CI.
#   # Language updates run in disposable Docker work containers, with their
#   # output and before/after dependency-file scans checked by KestreLynx.
#   # Neither application tests nor image rebuilds are run. Off by default.
#   pull_requests:
#     enabled: false
#   # Token for GitHub. Empty reads public repositories anonymously, which is
#   # enough without pull requests. With pull_requests enabled it is required
#   # and needs the permissions Contents: Read and write and Pull requests:
#   # Read and write on the configured repositories only (a fine-grained
#   # personal access token limited to them). Keep the file readable by its
#   # owner only.
#   github:
#     token: ""
#   # Logins for private image registries, used to look for newer images and
#   # to scan candidates. A host without an entry is reached anonymously.
#   # host is the registry host as written in image references, with the port
#   # if there is one, and without scheme or path. The password is a secret;
#   # keep the file readable by its owner only. A login is sent to its own
#   # host over HTTPS, and to the registry's token service only when that
#   # service is on the same host or listed in token_hosts. KestreLynx's own
#   # requests do not pass it on at any redirect. Trivy, which scans the
#   # candidate images, attaches its token again when the registry redirects
#   # to another path of the same host, and does not when the redirect leads
#   # to another host.
#   # GitHub Container Registry (ghcr.io) does not accept fine-grained
#   # personal access tokens: use a personal access token (classic) with the
#   # read:packages scope, and the GitHub user name it belongs to as username.
#   # Docker Hub: host docker.io, an access token as password, and
#   # token_hosts: [auth.docker.io].
#   # registries:
#   #   - host: ghcr.io
#   #     username: example-user
#   #     password: example-token-from-github
#   #   - host: registry.example.com:5000
#   #     username: example-puller
#   #     password: example-password
#   #     token_hosts: []
#   # Absolute directory for plans, delivery and PR records; persist it across
#   # container recreation. It is independent of state.path and defaults to a
#   # directory inside the supplied state volume.
#   storage_dir: /var/lib/kestrelynx/remediation
#   # Where each running Compose workload's source lives. Read and validated at
#   # startup. Each entry sets exactly one of compose (the Compose file and
#   # service that deploy it), dependencies (the directory holding its lockfiles)
#   # or dockerfile (the Dockerfile that builds its image). Paths are
#   # repository-relative and normalized; "." is the repository root. Example
#   # names only.
#   #
#   # For an image you build yourself, the findings in the layers of its base
#   # image are not fixed by a package update; a newer base image is. A
#   # dockerfile mapping names the Dockerfile and, optionally, the build stage
#   # (target) the running image comes from; without a target the last stage is
#   # used. KestreLynx follows the stage's FROM, through earlier stages that
#   # build on one another, to the base image, checks that the running image's
#   # layers start with the base's layers, and compares the current base with
#   # the newest patch of the same series, with a pull request that changes the
#   # tag in that FROM when pull_requests is enabled. The image rebuilt from the
#   # new Dockerfile is not built or scanned. For a service of a compose mapping
#   # whose build: is static (a context path, an optional dockerfile and target,
#   # no variables, no remote context, no dockerfile_inline), the Dockerfile is
#   # read from the build section and no dockerfile mapping is needed; a
#   # dockerfile mapping for the same workload must then agree with it. A base
#   # with a floating tag (for example python:3.12) gets no pull request; the
#   # plan says whether the tag still points at the base the image was built from
#   # and suggests rebuilding with `docker compose build --pull` if it does not.
#   #
#   # A dependencies mapping selects npm, pnpm, pip or uv files in one source
#   # directory. With PRs enabled, npm/pnpm/uv update lockfiles in work
#   # containers; pip validates the original and updated requirements.txt in
#   # separate containers. Selection uses running-image findings with scan
#   # status fixed and reported fixed versions, excluding findings without
#   # fixed-version information. For each finding, take the lowest reported
#   # fix newer than the installed version, then use the highest of those
#   # versions as the package's update lower bound. This selection does not
#   # verify resolution; with PRs enabled, updated dependency files are checked
#   # separately, including before/after scans. Updates may cross a major
#   # version; PR bodies and notifications call out major changes.
#   # If a direct dependency's range excludes a fixed version, only the
#   # version part of a supported manifest specifier is edited: X.Y.Z,
#   # =X.Y.Z, ^X.Y.Z or ~X.Y.Z for npm/pnpm, and == or ~= for uv.
#   # Transitive updates must stay within existing dependency constraints.
#   # Workspaces, Git/URL/local dependencies and dependencies requiring source
#   # builds need manual handling; npm packages that bundle dependencies or
#   # carry shrinkwrap, and packages nested under them, are also restricted.
#   # uv requires revision 5 of uv.lock and a requires-python constraint that
#   # admits the work image's Python 3.13.16.
#   # Work containers receive no GitHub token, main configuration or Docker
#   # socket; they run as non-root with all capabilities dropped,
#   # no-new-privileges and resource/time limits. With the distributed work
#   # image, ownership and permissions restrict writes to size-capped tmpfs.
#   # Override images must preserve the same ownership and permission
#   # restrictions; reference and digest checks do not inspect all image file
#   # permissions at runtime.
#   # The main process creates, starts and removes them through Docker API.
#   # A :ro socket mount does not limit these API operations and need not
#   # change to :rw.
#   mappings:
#     - workload: compose/example/web
#       repository: example/deployment
#       base_branch: main
#       compose:
#         path: compose.yml
#         service: web
#     - workload: compose/example/api
#       repository: example/application
#       base_branch: main
#       dependencies:
#         directory: .
#     - workload: compose/example/app
#       repository: example/application
#       base_branch: main
#       dockerfile:
#         path: docker/Dockerfile
#         target: runtime
#   # Processing limits. Every value must be positive; work beyond a limit is
#   # deferred, not counted as having no candidate. Candidate scans and
#   # baseline rescans have separate per-cycle budgets. Registry requests
#   # include token exchanges; tag_pages_per_repository is per repository and
#   # counts tag listing requests (a pinned tag's series is read with a
#   # request for each step through the tag list, not page by page).
#   # cycle_timeout covers planning, dependency updates and PR processing,
#   # not the ordinary scans of running images.
#   # new_prs_per_cycle caps new PRs per cycle; open_prs caps open KestreLynx
#   # PRs across configured repositories (none is closed just to make room).
#   limits:
#     candidate_scans_per_cycle: 10
#     baseline_rescans_per_cycle: 10
#     registry_requests_per_cycle: 200
#     tag_pages_per_repository: 20
#     cycle_timeout: 30m
#     new_prs_per_cycle: 3
#     open_prs: 10
#     # With PRs enabled, dependency_jobs_per_cycle caps dependency update
#     # units attempted per cycle, not packages or containers; one unit can
#     # use multiple containers, as with pip or manifest edits.
#     # Units beyond this limit are deferred.
#     # job_timeout bounds each container's creation, execution and result
#     # collection, not the whole unit; cleanup has a separate 30s deadline.
#     # The accepted range is 1m to 60m30s, with 30s reserved from the internal
#     # job's deadline for startup and reporting (internal maximum: 60m).
#     dependency_jobs_per_cycle: 3
#     job_timeout: 6m
#   # Language package updates run in throwaway containers of the official
#   # Node.js (npm, pnpm) and Python (uv, pip) images that each main release
#   # pins by digest. The package manager itself is fetched from the public
#   # registry by KestreLynx, checked, cached under storage_dir and handed to
#   # the container; the Docker daemon pulls the images when first needed.
#   # An unavailable image or package manager defers language updates;
#   # package managers are never run in the main container instead.
#   # The settings below are validated at startup even when remediation is
#   # disabled.
#   # worker:
#   #   # A Docker Hub mirror, as host[:port][/path]. It replaces the host and
#   #   # path the official images are pulled from; the digests stay those of
#   #   # the release, so a mirror that alters an image is refused.
#   #   registry: registry.example.com:5000/dockerhub
#   #   tool_versions:
#   #     # A package manager release is used only once it has been published
#   #     # this long.
#   #     min_release_age: 72h
#   #     # Capacity of the cache of package manager releases.
#   #     cache_max_size: 1GiB
#   #   # The old "image" key was removed. While it is set, language package
#   #   # updates stay off.
