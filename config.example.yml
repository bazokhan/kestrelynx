# KestreLynx configuration (single self-contained file). Copy to config.yml to use.
# Setting at least one notify target is enough to run; omit the rest to use defaults.

schedule:
  # Time of day to run once daily, in local time (HH:MM).
  # Leave empty to switch to interval mode ("every 24h since startup").
  daily_at: "09:00"
  # Run one scan immediately on startup.
  run_on_start: true

scan:
  # Severities to report on. Defaults to HIGH and CRITICAL only.
  severity: [HIGH, CRITICAL]

notify:
  # Slack Incoming Webhook (sends a preformatted message).
  slack_webhook_url: ""
  # Slack Web API delivery (alternative to the webhook — set one, not both):
  # a bot token with chat:write plus the destination channel ID. On top of the
  # same channel summary, this posts the full open-findings report into the
  # summary's thread (urgent/watch expanded, low as a count), and on quiet
  # days links back to the last full report instead.
  slack_bot_token: ""
  slack_channel: ""
  # Generic webhook (POSTs structured JSON). The receiver can process it freely.
  generic_webhook_url: ""
  # Whether to send a message even when nothing is wrong. Defaults to false (notify only on findings).
  notify_on_clean: false
  # diff (default): only notify what changed since the last scan, plus a one-line
  # "open now" summary with the age of the oldest unresolved finding. Days with
  # open findings but no changes get a short heartbeat instead of a repeat.
  # full: resend the complete report every scan (the pre-diff behavior).
  mode: "diff"
  # In diff mode, the weekday to send the complete report as a weekly digest,
  # so details are never more than a week away. Set to "never" to disable.
  full_report_day: "monday"
  # Wording language for the Slack channel message and thread report. "en"
  # (default) or "ja". The generic webhook payload is always English (it's
  # consumed programmatically, not read in Slack) and is never affected by
  # this setting.
  language: "en"

docker:
  # Path to docker.sock. KestreLynx only performs GET /containers/json.
  socket: "/var/run/docker.sock"

# Kubernetes adapter (alternative to docker: above, not both). See
# deploy/kubernetes/ for the manifests this is meant to run under.
# kubernetes:
#   # Set true to scan a Kubernetes cluster instead of a single Docker host.
#   # Mutually exclusive with docker.socket (leave that section out entirely).
#   enabled: false
#   # kube-apiserver base URL, e.g. "https://10.0.0.1:443". Leave empty inside
#   # a cluster: it's built from the KUBERNETES_SERVICE_HOST/PORT environment
#   # variables Kubernetes injects into every Pod.
#   api_server: ""
#   # ServiceAccount token path. Leave empty to use the projected token every
#   # Pod gets by default.
#   token_file: ""
#   # Cluster CA bundle path. Leave empty to use the default projected CA.
#   ca_file: ""
#   # Overrides the TLS server name used to validate the apiserver's
#   # certificate. Leave empty unless api_server names an address the
#   # certificate doesn't carry as a SAN.
#   tls_server_name: ""
#   # Restrict scanning to these namespaces. Empty (or omitted) scans every
#   # namespace. Each entry must be a valid namespace name (lowercase
#   # alphanumerics and hyphens, 1-63 bytes, alphanumeric ends).
#   namespaces: []

environment:
  # Optional name for this instance's scan history (e.g. "prod-vps"). This
  # names the history, not the machine: it is not derived from hostname/IP
  # and does not identify the host. Keep it unchanged across host rebuilds
  # and migrations and the history continues as the same environment. When
  # set, it is shown in the Slack header and in the generic webhook payload
  # so reports from multiple KestreLynx instances can be told apart.
  # Lowercase alphanumerics and hyphens only, 1-63 bytes, must start and
  # end with an alphanumeric. Leave empty for the unnamed default
  # environment (current single-host behavior, unchanged).
  name: ""

state:
  # Where diff mode remembers previous scans (JSON, one small file). Mount a
  # volume here so first-seen dates survive container recreation.
  path: "/var/lib/kestrelynx/state.json"

triage:
  # Rank findings by real-world exploitation signals instead of severity alone:
  # CISA KEV (confirmed exploitation) and EPSS (predicted probability) are
  # downloaded in bulk once a day and joined locally by CVE id — your CVE list
  # never leaves the host. Notifications become three buckets: act now / watch /
  # low. Adds outbound HTTPS to www.cisa.gov and epss.empiricalsecurity.com;
  # set enabled: false to opt out (severity-only notifications, no extra egress).
  enabled: true
  # EPSS probability at or above which a CVE is "act now". 0.10 = 10%.
  act_now_epss: 0.10
  # EPSS probability at or above which a CVE is at least "watch". 0.01 = 1%.
  watch_epss: 0.01
  # Mirror URLs for air-gapped environments. Empty = the official feeds.
  kev_url: ""
  epss_url: ""
  # Attach the Hacker News discussion link to "act now" findings. Unlike the
  # bulk feeds above, this sends those CVE IDs (only — a handful of well-known,
  # actively exploited CVEs) as search queries to hn.algolia.com. Set to false
  # for zero CVE egress; advisory links from the KEV notes still work (they
  # come from the bulk feed).
  discussion_links: true

runtime:
  # Show which packages an optional, experimental, separately-privileged Sensor companion
  # process (`kestrelynx sensor`, deploy/docker/docker-compose.sensor.yml)
  # actually observed running, alongside the ordinary vulnerability
  # findings. Requires deploying the Sensor and sharing its evidence volume
  # with this container (read-only) — see the Sensor compose file's own
  # comments for both steps. With no Sensor deployed, leave this false: the
  # main body never opens evidence_dir and every notification is unaffected.
  enabled: false
  # Where the Sensor's evidence volume is mounted into this container. Must
  # match the Sensor's own --evidence-dir (same default on both sides).
  evidence_dir: "/var/lib/kestrelynx-runtime"
  # Once runtime evidence is available, additionally hide from Slack (rows
  # only — the generic webhook always keeps every finding, with an added
  # muted/muted_reason marker) a package finding with no fix coming
  # (affected or will_not_fix; never fixed, and never end-of-life, which is
  # always shown) that nothing has used for at least 7 days of observation
  # and that isn't act now. Hidden findings are replaced by a single
  # "🔇 Muted" count; one that becomes used, gets a fix, or turns act now
  # reappears immediately as an ordinary change. Has no effect unless
  # enabled above is also true.
  mute_unfixable_not_in_use: false

# Fix plan (experimental). For each running image that has a fixed
# vulnerability, look for a newer image in its registry, scan it under the
# same vulnerability databases as the running one, and report whether updating
# would resolve the findings. By default nothing is pulled, changed or created;
# the plan appears as a short "Fix plan" section in Slack and a `remediation`
# object in the generic webhook payload. With pull_requests enabled, KestreLynx
# also opens pull requests that change the image tag of Compose services (see
# below). Docker only (not supported with
# kubernetes.enabled). Public registries only; it needs outbound HTTPS to the
# image registries and downloads the Trivy databases before each cycle.
# Disabled by default; with it off, scans and notifications are unchanged.
#
# remediation:
#   enabled: true
#   # Open one pull request per Compose file and running image that updates
#   # services.<service>.image to the adopted newer patch tag. Only the tag of
#   # the mapped services is edited; nothing is merged and no existing branch
#   # is changed. Needs remediation.enabled, Docker mode, compose
#   # mappings below and github.token. Opening a pull request can start the
#   # repository's CI (workflows that run on pull_request events), so enable it
#   # only for repositories where that is acceptable. Off by default.
#   pull_requests:
#     enabled: false
#   # Token for GitHub. Empty reads public repositories anonymously, which is
#   # enough without pull requests. With pull_requests enabled it is required
#   # and needs the permissions Contents: Read and write and Pull requests:
#   # Read and write on the configured repositories only (a fine-grained
#   # personal access token limited to them). Keep the file readable by its
#   # owner only.
#   github:
#     token: ""
#   # Where the plan and delivery records are kept (an absolute path).
#   storage_dir: /var/lib/kestrelynx/remediation
#   # Where each running Compose workload's source lives. Read and validated at
#   # startup; no source is fetched yet. Each entry sets exactly one of
#   # compose (the Compose file and service that deploy it) or dependencies
#   # (the directory holding its lockfiles). Paths are repository-relative and
#   # normalized; "." is the repository root. Example names only.
#   mappings:
#     - workload: compose/example/web
#       repository: example/deployment
#       base_branch: main
#       compose:
#         path: compose.yml
#         service: web
#     - workload: compose/example/api
#       repository: example/application
#       base_branch: main
#       dependencies:
#         directory: .
#   # Per-cycle limits (provisional defaults shown). Every value must be
#   # positive. Work past a limit is reported as deferred, not dropped.
#   # tag_pages_per_repository applies to each repository separately;
#   # cycle_timeout is the deadline of the plan stage, not of the scans.
#   # new_prs_per_cycle is how many pull requests one cycle may open;
#   # open_prs is how many of KestreLynx's pull requests may be open at once
#   # (an old one is never closed to make room).
#   limits:
#     candidate_scans_per_cycle: 10
#     baseline_rescans_per_cycle: 10
#     registry_requests_per_cycle: 200
#     tag_pages_per_repository: 20
#     cycle_timeout: 30m
#     new_prs_per_cycle: 3
#     open_prs: 10
